[project]
name = "aika-ingestion-pubmed"
version = "0.1.0"
description = "Connettore PubMed/PMC (Open Access) per la pipeline RAG sull'alimentazione del paziente in dialisi"
readme = "README.md"
authors = [
    { name = "Stefano", email = "indyos71@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "pyjwt[crypto]>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
aika-ingestion-pubmed = "aika_ingestion_pubmed.cli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "lxml-stubs>=0.5.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-recording>=0.13.4",
    "ruff>=0.16.9",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# I test non devono mai chiamare NCBI: qualsiasi socket aperto fa fallire il test.
addopts = "--block-network"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]
# Testi e commenti in italiano con caratteri tipografici (–, «», →); le righe lunghe in
# docstring/commenti non sono un problema, il formatter gestisce il codice.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "PT018"]

[tool.ruff.format]
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.13"
include = ["src", "tests"]
strict = ["src"]
typeCheckingMode = "standard"
# lxml-stubs espone i tipi solo tramite `etree._Element`: l'uso "privato" è inevitabile.
reportPrivateUsage = false
